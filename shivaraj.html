    phototitle: 'Dijkstra Algorithm',
    problem: `In a complex school or universities, a parent who visits once in a while will face issue to walk across department building
    , canteens, seminar halls, hostels, and other venues. There are situations where a parent want to visit a particular venue in a very short path and time
    but there could bea situations where parent wants to visit certain venue with his child not in very short span of time, as he wants to spend time with child and also
    want to visit the venue(in longest distance)`,
    solution: `This particular problem can be solved using Dijkstra's algorithm for both shortest and longest path. Usually Dijkstra gives shortest path with condition -- dist[u]+cost[v][u] < dist[v] , 
    this condtion can be use to find the shortest path between two point through different paths. But for the longest path one can change condition to --  dist[u]+cost[v][u] > dist[v], 
    in Dijkstra's algorithm changing this condition along with min value will give the longest path
    between two point through other paths.`,

    #include <iostream>
        using namespace std;
        
        #define MAXN 100
        #define INF 999
        
        int main() {
            int n;
            cout << "Enter the number of Vertices ";
            cin >> n;
        
            int cost[MAXN][MAXN];
        
            cout << "Enter the cost matrix: (Enter 999 for Infinity) ";
            for (int i = 0; i < n; i++) {
                for (int j = 0; j < n; j++) {
                    cin >> cost[i][j];
                }
            }
        
            int source;
            cout << "Enter the source ";
            cin >> source;
        
            int dist[MAXN], path[MAXN], visited[MAXN];
        
        
            for (int i = 0; i < n; i++) {
                dist[i] = cost[source][i];
                path[i] = source;
                visited[i] = 0;
            }
            visited[source] = 1;
        
        
            for (int iter = 0; iter < n - 1; iter++) {
                int u = -1;
                int min = INF + 1;
        
        
                for (int i = 0; i < n; i++) {
                    if (!visited[i] && dist[i] < min) {
                        min = dist[i];
                        u = i;
                    }
                }
        
                if (u == -1)
                    break;
        
                visited[u] = 1;
        
        
                for (int v = 0; v < n; v++) {
                    if (!visited[v] && cost[u][v] != INF) {
                        if (dist[u] + cost[u][v] < dist[v]) {
                            dist[v] = dist[u] + cost[u][v];
                            path[v] = u;
                        }
                    }
                }
            }
        
            cout << " Vertex   Dist   Path ";
            for (int i = 0; i < n; i++) {
                cout << i << "        " << dist[i] << "      " << path[i] << " ";
            }

    id: 'p2',

    title: 'Wiring and adding fiber cable to whole campur efficiently.',
    photo: './shivaraj/Kruskal.png',
    phototitle: 'Kruskal Algorithm',
    problem: `A large campus needs to be wired and have fiber cables for wifi, but without proper planning, the cost or weight of the cables can become very high and useless.
    In here just using tree structure will be not efficient as it may lead to long cables and can cut the whole system if one edge gets disconnected.
    Using Graph structure alone can be also inefficient as it also lead to long cables and high cost, but it can reduce the dependecy of one edge on othere node.`,
    solution: `As seen in the problem part, using Graph alone is ineffiecient. So to solve this we can use Kruskal's along with Graph algorithms. 
    The method here is first create a cheapest spanning tree using Kruskal's algorithm, then taking the edges which were neglected by kruskal's algorithm and adding them back in same order until all the nodes have atleast 1 edge connected to it. 
    By this way we can reduce the weight of cables used overall and also reduce dependecy of one edge on other single edge.`,

    codeSnippet: `
    #include <iostream>
    using namespace std;
    
    // ---------------- KRUSKAL ----------------
    
    struct Edge {
        int u, v, w;
    };
    
    int parent[1000], rnk[1000];
    
    void makeSet(int n) {
        for (int i = 0; i < n; i++) {
            parent[i] = i;
            rnk[i] = 0;
        }
    }
    
    int findSet(int x) {
        if (parent[x] != x)
            parent[x] = findSet(parent[x]);
        return parent[x];
    }
    
    bool unionSet(int a, int b) {
        a = findSet(a);
        b = findSet(b);
        if (a == b) return false;
    
        if (rnk[a] < rnk[b]) {
            int temp = a; a = b; b = temp;
        }
        parent[b] = a;
        if (rnk[a] == rnk[b]) rnk[a]++;
        return true;
    }
    
    int kruskal(int n, Edge edges[], int m, Edge mst[]) {
        // Bubble sort edges by weight
        for (int i = 0; i < m; i++) {
            for (int j = i + 1; j < m; j++) {
                if (edges[j].w < edges[i].w) {
                    Edge temp = edges[i];
                    edges[i] = edges[j];
                    edges[j] = temp;
                }
            }
        }
    
        makeSet(n);
        int mstCount = 0;
    
        for (int i = 0; i < m; i++) {
            if (unionSet(edges[i].u, edges[i].v)) {
                mst[mstCount++] = edges[i];
            }
        }
    
        return mstCount;
    }
    
    // ---------------- DFS ----------------
    
    void dfs(int node, int n, int adj[100][100], int visited[]) {
        visited[node] = 1;
        cout << node << " ";
    
        for (int j = 0; j < n; j++) {
            if (adj[node][j] == 1 && !visited[j]) {
                dfs(j, n, adj, visited);
            }
        }
    }
    
    // ---------------- MAIN ----------------
    
    int main() {
        int n, m;
        cin >> n >> m;   // number of nodes and edges
    
        Edge edges[1000];
        Edge mst[1000];
    
        // Read edges
        for (int i = 0; i < m; i++) {
            cin >> edges[i].u >> edges[i].v >> edges[i].w;
        }
    
        // Run Kruskal
        int mstEdges = kruskal(n, edges, m, mst);
    
        // Build adjacency matrix from MST
        int adj[100][100] = {0};
        for (int i = 0; i < mstEdges; i++) {
            int u = mst[i].u;
            int v = mst[i].v;
            adj[u][v] = 1;
            adj[v][u] = 1;
        }
    
        // DFS
        int visited[100] = {0};
        cout << "DFS Traversal from node 0:\n";
        dfs(0, n, adj, visited);
    
        return 0;
    }

`

    problem: `In this new era of technology, schools and universities are providing digital libraries for students to access books and research papers online.
    However, in the digital book or research paper if a student want to search for particular keyword or topic then without prior knowledge of the topic it can be hard to find the topic or keyword in the book with a small font size
    letters.`,
    solution: `To solve this problem we have three method BFSS, Knuth-Morris-Pratt algorithm and Rabin karp algorithm. But only KMP is efficient among these three algorithms.
    BFSS will search for each character one by one which is inefficient and have O(n) time complexity = N*M where N is the length of pattern and M is the length of text.
    Rabin karp algorithm uses hashing technique and have to compute modulus which is not efficient for large book or library, but it can lead to collision and false match. and has time complexity O(n)= N*M.
    The best among these three is KMP algorithm, this is different from BFSS as BFSS will transverse through each character one by one, KMP checks the first character and if it doesn't matches then it will shift by K-pi(K-1) places and check again.
    It has time complexity O(n)=N always where N is the length of pattern.`,

    codeSnippet: `
    #include <iostream>
    #include <cstring>
    #include <cstdio>
    using namespace std;
    
    // ---------------- LPS (Longest Prefix Suffix) ----------------
    
    void buildLPS(char pat[], int m, int lps[]) {
        int len = 0;      // length of previous longest prefix suffix
        lps[0] = 0;       // first value always 0
    
        int i = 1;
        while (i < m) {
            if (pat[i] == pat[len]) {
                len++;
                lps[i] = len;
                i++;
            } else {
                if (len != 0) {
                    len = lps[len - 1];   // fallback
                } else {
                    lps[i] = 0;
                    i++;
                }
            }
        }
    }
    
    // ---------------- KMP SEARCH ----------------
    
    void KMPSearch(char pat[], char txt[]) {
        int m = strlen(pat);
        int n = strlen(txt);
    
        int lps[1000];
        buildLPS(pat, m, lps);
    
        int i = 0; // index for txt
        int j = 0; // index for pat
    
        while (i < n) {
            if (pat[j] == txt[i]) {
                i++;
                j++;
            }
    
            if (j == m) {
                printf("Pattern found at index %d\n", i - j);
                j = lps[j - 1];
            }
            else if (i < n && pat[j] != txt[i]) {
                if (j != 0)
                    j = lps[j - 1];
                else
                    i++;
            }
        }
    }
    
    // ---------------- MAIN ----------------
    
    int main() {
        char text[1000];
        char pattern[1000];
    
        cout << "Enter text: ";
        cin >> text;
    
        cout << "Enter pattern: ";
        cin >> pattern;
    
        KMPSearch(pattern, text);
    
        return 0;
    }

    `

    #include <bits/stdc++.h>

        // Water network represented as an undirected graph
        struct WaterNetwork {
            int n;                          // number of junctions / corners
            vector<vector<int>> adj;        // adjacency list
        
            WaterNetwork(int n) : n(n), adj(n) {}
        
            // Add a pipe between two junctions (u, v)
            void addPipe(int u, int v) {
                adj[u].push_back(v);
                adj[v].push_back(u);
            }
        
            // Check if all junctions still receive water from 'source'
            // when pipe (failU, failV) is broken.
            bool canSupplyAll(int source, int failU = -1, int failV = -1) {
                vector<int> vis(n, 0);
                queue<int> q;
                q.push(source);
                vis[source] = 1;
        
                auto isFailed = [&](int a, int b) {
                    if (failU == -1 && failV == -1) return false; // no failure
                    return (a == failU && b == failV) || (a == failV && b == failU);
                };
        
                while (!q.empty()) {
                    int u = q.front(); q.pop();
                    for (int v : adj[u]) {
                        // Skip the broken pipe
                        if (isFailed(u, v)) continue;
                        if (!vis[v]) {
                            vis[v] = 1;
                            q.push(v);
                        }
                    }
                }
        
                // If every junction was visited, water reached the whole building
                return all_of(vis.begin(), vis.end(), [](int x){ return x == 1; });
            }
        };
        
        int main() {
            ios::sync_with_stdio(false);
            cin.tie(nullptr);

            cin >> n >> m;

            cout << "Example: 0 1 means pipe between junction 0 and 1 ";
            for (int i = 0; i < m; ++i) {

            }
        
            int source;

            cin >> source;

            if (ok)
                cout << "All sections STILL receive water. Graph design is robust. ";
            else
                cout << "Some sections LOSE water. Need more alternate pipes. ";
        
            return 0;
        }

        int find(int x) {
            if (parent[x] == x) return x;
