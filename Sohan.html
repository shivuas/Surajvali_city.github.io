const int INF = 1e9;

void dijkstra(int n, vector<vector<int>>& cost, int src, vector<int>& dist) {
    dist.assign(n, INF);
    vector<bool> used(n, false);
    dist[src] = 0;

    for (int iter = 0; iter < n - 1; iter++) {
        int u = -1;
        for (int i = 0; i < n; i++) {
            if (!used[i] && (u == -1 || dist[i] < dist[u])) {
                u = i;
            }
        }
        if (u == -1) break;
        used[u] = true;

        for (int v = 0; v < n; v++) {
            if (cost[u][v] != INF && dist[u] + cost[u][v] < dist[v]) {
                dist[v] = dist[u] + cost[u][v];
            }
        }
    }
    // dist[v] = minimum travel time from src to stop v
}`,

const int INF = 1e9;

void floyd(int n, vector<vector<int>>& dist) {
    // dist[i][j] initially stores direct travel time from junction i to j
    for (int k = 0; k < n; k++) {
        for (int i = 0; i < n; i++) {
            for (int j = 0; j < n; j++) {
                if (dist[i][k] < INF && dist[k][j] < INF &&
                    dist[i][k] + dist[k][j] < dist[i][j]) {
                    dist[i][j] = dist[i][k] + dist[k][j];

            }
        }

}`,

void primMST(int n, vector<vector<int>>& cost,
             vector<int>& parent) {
    vector<int> key(n, INF);
    vector<bool> inMST(n, false);
    parent.assign(n, -1);

    key[0] = 0; // start from first hub
    for (int iter = 0; iter < n - 1; iter++) {
        int u = -1;
        for (int i = 0; i < n; i++) {
            if (!inMST[i] && (u == -1 || key[i] < key[u])) {
                u = i;
            }
        }
        inMST[u] = true;

        for (int v = 0; v < n; v++) {
            if (cost[u][v] != INF && !inMST[v] && cost[u][v] < key[v]) {
                key[v] = cost[u][v];
                parent[v] = u;
            }
        }
    }
    // parent[v] gives backbone connection parent[v] -> v
}`,

int bestCoverage = 0;
vector<int> bestSet;

void chooseShelters(int n, vector<int>& passengers, int K) {
    int totalMasks = 1 << n; // 2^n subsets

    for (int mask = 0; mask < totalMasks; mask++) {
        if (__builtin_popcount(mask) != K) continue;

        int coverage = 0;
        for (int i = 0; i < n; i++) {
            if (mask & (1 << i)) {
                coverage += passengers[i];
            }
        }

        if (coverage > bestCoverage) {
            bestCoverage = coverage;
            bestSet.clear();
            for (int i = 0; i < n; i++) {
                if (mask & (1 << i)) bestSet.push_back(i);
            }
        }
    }
    // bestSet holds indices of stops where shelters should be built
}`,

      p7: `// KMP string search – find pattern in incident logs
vector<int> buildLPS(const string& pat) {
    int m = (int)pat.size();
    vector<int> lps(m);
    int len = 0;
    lps[0] = 0;
    int i = 1;

    while (i < m) {
        if (pat[i] == pat[len]) {
            len++;
            lps[i] = len;
            i++;
        } else {
            if (len != 0) {
                len = lps[len - 1];
            } else {
                lps[i] = 0;
                i++;
            }
        }
    }
    return lps;
}

vector<int> KMP_search(const string& text, const string& pat) {
    vector<int> res;
    if (pat.empty()) return res;

    vector<int> lps = buildLPS(pat);
    int n = (int)text.size();
    int m = (int)pat.size();
    int i = 0, j = 0;

    while (i < n) {
        if (text[i] == pat[j]) {
            i++; j++;
            if (j == m) {
                res.push_back(i - j); // match at i - j
                j = lps[j - 1];
            }
        } else {
            if (j != 0) {
                j = lps[j - 1];
            } else {
                i++;
            }
        }
    }
    return res; // indexes where pattern appears
}`,
      p8: `// Renewable Energy Forecasting – similarity search + sorting
// Find past days with similar weather and average their generation curves.

struct DayFeatures {
    double temp;
    double cloud;
    double wind;
    // plus more features if needed
    vector<double> generation; // power values across the day
};

// Simple distance between target and historical day
double distanceDay(const DayFeatures& a, const DayFeatures& b) {
    return fabs(a.temp - b.temp) +
           fabs(a.cloud - b.cloud) +
           fabs(a.wind - b.wind);
}

void forecastRenewable(const vector<DayFeatures>& history,
                       const DayFeatures& target,
                       int k,
                       vector<double>& forecast) {
    int n = (int)history.size();
    vector<pair<double,int>> distIdx;
    distIdx.reserve(n);

    // 1) Brute force: compute distance to every past day
    for (int i = 0; i < n; i++) {
        double d = distanceDay(history[i], target);
        distIdx.push_back({d, i});
    }

    // 2) Sort by similarity (ascending distance)
    sort(distIdx.begin(), distIdx.end(),
         [](auto& a, auto& b){ return a.first < b.first; });

    // 3) Use top-k similar days to build forecast curve
    int m = (int)history[0].generation.size();
    forecast.assign(m, 0.0);

    k = min(k, n);
    for (int t = 0; t < m; t++) {
        double sum = 0.0;
        for (int j = 0; j < k; j++) {
            int idx = distIdx[j].second;
            sum += history[idx].generation[t];
        }
        forecast[t] = sum / k; // average power at time slot t
    }
}`,

// Each sensor reports current and voltage. We check for abnormal values

struct Sensor {

    double voltage;
    bool healthy;
};

bool isAbnormal(double current, double voltage,
                double Imin, double Imax,
                double Vmin, double Vmax) {
    return (current < Imin || current > Imax ||
            voltage < Vmin || voltage > Vmax);
}

// adjacency list of feeders: u -> v if line segment exists
void detectFault(const vector<vector<int>>& adj,
                 vector<Sensor>& sensors,
                 double Imin, double Imax,
                 double Vmin, double Vmax) {
    int n = (int)sensors.size();
    vector<int> suspicious;

    // 1) Check all sensors (brute force) for abnormal measurements
    for (int i = 0; i < n; i++) {
        if (isAbnormal(sensors[i].current, sensors[i].voltage,
                       Imin, Imax, Vmin, Vmax)) {
            suspicious.push_back(i);
        }
    }

    if (suspicious.empty()) {
        cout << "No obvious fault detected.\\n";
        return;
    }

    // 2) For simplicity, pick first suspicious sensor as starting point
    int start = suspicious[0];
    cout << "Fault likely near sensor " << start << "\\n";

    // 3) Optional: BFS from this node to mark affected area
    queue<int> q;
    vector<bool> vis(n,false);
    q.push(start);
    vis[start] = true;

    while (!q.empty()) {
        int u = q.front(); q.pop();
        for (int v : adj[u]) {
            if (!vis[v]) {
                vis[v] = true;
                q.push(v);
            }
        }
    }

    // nodes with vis[v] == true lie in same feeder section and can be isolated
}`,

struct Node {
    double avgLoad;        // kWh per day for building / load point
    double solarPotential; // max kW of rooftop solar that can be installed
};

const int INF = 1e9;

// Input:
//   n          = number of nodes in the microgrid
//   nodes[i]   = load + solar potential info for node i
//   cost[i][j] = cost (or distance) of laying cable between node i and j
// Output:
//   solarSize[i]   = chosen solar size at node i (kW)
//   batterySize[i] = chosen battery size at node i (kWh)
//   parent[i]      = parent of node i in MST (microgrid backbone)
void planMicrogrid(int n,
                   const vector<Node>& nodes,
                   const vector<vector<int>>& cost,
                   vector<double>& solarSize,
                   vector<double>& batterySize,
                   vector<int>& parent)
{
    solarSize.assign(n, 0.0);
    batterySize.assign(n, 0.0);
    parent.assign(n, -1);

    // 1) Simple sizing rules for solar & battery
    for (int i = 0; i < n; i++) {
        double aimSolar = 0.60 * nodes[i].avgLoad; // kW approx
        double aimBatt  = 0.30 * nodes[i].avgLoad; // kWh approx

        solarSize[i]   = min(aimSolar, nodes[i].solarPotential);
        batterySize[i] = aimBatt;
    }

    // 2) Prim's algorithm to design MST wiring layout
    vector<int> key(n, INF);
    vector<bool> inMST(n, false);

    key[0] = 0;    // start from main substation node 0
    parent[0] = -1;

    for (int iter = 0; iter < n - 1; iter++) {
        int u = -1;
        for (int i = 0; i < n; i++) {
            if (!inMST[i] && (u == -1 || key[i] < key[u])) {
                u = i;
            }
        }
        if (u == -1) break;
        inMST[u] = true;

        for (int v = 0; v < n; v++) {
            if (!inMST[v] && cost[u][v] < key[v]) {
                key[v] = cost[u][v];
                parent[v] = u;
            }
        }
    }
    // parent[] now describes the backbone microgrid connections

    const nav = document.getElementById('nav');

    function makeNav() {
      nav.innerHTML = '';
      pages.forEach((p) => {
        const d = document.createElement('div');
        d.className = 'navitem';
        d.dataset.id = p.id;
        d.innerHTML =
          `<h4>${p.title}</h4><p class="metadata" style="color:#0284c7;">${p.zone} • ${p.algos.join(', ')}</p>`;
        d.onclick = () => { select(p.id); };
        nav.appendChild(d);

    function getNavIds() {
      return Array.from(nav.children).map(d => d.dataset.id);
    }

    function nextCase() {
      const ids = getNavIds();
      if (!ids.length || !currentId) return;
      const idx = ids.indexOf(currentId);
      const nextId = ids[(idx + 1) % ids.length];
      select(nextId);
    }

    function prevCase() {
      const ids = getNavIds();
      if (!ids.length || !currentId) return;
      const idx = ids.indexOf(currentId);
      const prevId = ids[(idx - 1 + ids.length) % ids.length];
      select(prevId);
    }

    function select(id) {
      currentId = id;
      Array.from(nav.children).forEach(n => {
        const isActive = n.dataset.id === id;
        n.classList.toggle('active', isActive);
        if (isActive) {
          // keep active item in view
          n.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
        }
      });
      const p = pages.find(x => x.id === id);
      if (!p) return;

      const sdgHtml = (p.sdg && p.sdg.length)

      return (s || '')
        .toString()
        .replaceAll('&', '&amp;')
        .replaceAll('<', '&lt;')

      const url = location.href.split('#')[0] + '#' + id;
      navigator.clipboard?.writeText(url).then(() => alert('Link copied to clipboard'));

    });

    document.addEventListener('keydown', (e) => {
      const tag = e.target.tagName;
      if (tag === 'INPUT' || tag === 'TEXTAREA') return;

      if (e.key === 'ArrowDown') {
        e.preventDefault();
        nextCase();
      } else if (e.key === 'ArrowUp') {
        e.preventDefault();
