        #include <bits/stdc++.h>
        using namespace std;

        vector<int> dijkstra(int n, vector<vector<pair<int,int>>> &g, int src) {
            vector<int> dist(n, INT_MAX);
            priority_queue<pair<int,int>, vector<pair<int,int>>, greater<pair<int,int>>> pq;
            dist[src] = 0;
            pq.push({0, src});
            while (!pq.empty()) {
                auto [d,u] = pq.top();
                pq.pop();
                if (d != dist[u]) continue;
                for (auto &edge : g[u]) {
                    int v = edge.first, w = edge.second;
                    if (dist[u] + w < dist[v]) {
                        dist[v] = dist[u] + w;
                        pq.push({dist[v], v});
                    }
                }
            }
            return dist;
        }

        int maxFlow(int n, vector<vector<int>> &cap, int s, int t) {
            int flow = 0;
            while (true) {
                vector<int> parent(n, -1);
                queue<int> q;
                q.push(s);
                parent[s] = s;
                while (!q.empty() && parent[t] == -1) {
                    int u = q.front();
                    q.pop();
                    for (int v = 0; v < n; v++) {
                        if (parent[v] == -1 && cap[u][v] > 0) {
                            parent[v] = u;
                            q.push(v);
                        }
                    }
                }
                if (parent[t] == -1) break;
                int aug = INT_MAX;
                for (int v = t; v != s; v = parent[v])
                    aug = min(aug, cap[parent[v]][v]);
                for (int v = t; v != s; v = parent[v]) {
                    cap[parent[v]][v] -= aug;
                    cap[v][parent[v]] += aug;
                }
                flow += aug;
            }
            return flow;
        }

        int main() {

        solution: `To solve this problem, the city’s road network is represented as a graph, where intersections are nodes and roads between them are weighted edges based on travel time or distance. When an emergency occurs, a water tanker must be routed from the nearest available depot to the affected location using the fastest possible path. To identify this path efficiently, Dijkstra’s Algorithm is applied, since it computes the shortest path from a source node to all other nodes in a weighted graph. During execution, a min-heap (priority queue) is used to repeatedly choose the next node with the smallest known distance, improving performance compared to a linear search. A distance array maintains the shortest known distance to every node, while a visited array keeps track of processed nodes to avoid recalculating routes. A predecessor array can store the previous node in each shortest path to reconstruct the full route once the algorithm finishes. To support multiple emergencies, a queue can be used to handle requests one by one in order of arrival, ensuring fairness and immediate routing. This system ensures that during disasters, water tankers reach critical zones quickly through optimized routing, minimizing response time and saving lives.`,

        #include <bits/stdc++.h>
        using namespace std;

        bool isWordBoundary(const string &text, int start, int end) {
            bool left = (start == 0) || !isalnum(text[start - 1]);
            bool right = (end == text.size()) || !isalnum(text[end]);
            return left && right;
        }

        unordered_map<string, vector<pair<int,int>>> rabinKarpMulti(
            const string &text, const vector<string> &patterns,
            long long base = 256, long long mod = (1LL<<61)-1)
        {
            unordered_map<string, vector<pair<int,int>>> results;
            for (auto &p : patterns) results[p] = {};

            if (patterns.empty()) return results;

            unordered_map<int, vector<string>> byLen;
            for (auto &p : patterns) byLen[p.size()].push_back(p);

            int n = text.size();

            for (auto &entry : byLen) {
                int L = entry.first;
                auto &pats = entry.second;
                if (L > n) continue;

                unordered_map<long long, vector<string>> hashToPat;
                long long powL = 1;
                for (int i = 0; i < L; i++) powL = (powL * base) % mod;

                for (auto &p : pats) {
                    long long h = 0;
                    for (char c : p) h = (h * base + c) % mod;
                    hashToPat[h].push_back(p);
                }

                long long win = 0;
                for (int i = 0; i < L; i++) win = (win * base + text[i]) % mod;

                if (hashToPat.count(win)) {
                    for (auto &p : hashToPat[win]) {
                        if (text.substr(0, L) == p && isWordBoundary(text, 0, L))
                            results[p].push_back({0, L});
                    }
                }

                for (int i = 1; i <= n - L; i++) {
                    long long left = text[i - 1];
                    long long right = text[i + L - 1];
                    win = (win * base - left * powL + right) % mod;
                    if (win < 0) win += mod;

                    if (hashToPat.count(win)) {
                        string window = text.substr(i, L);
                        for (auto &p : hashToPat[win]) {
                            if (window == p && isWordBoundary(text, i, i + L))
                                results[p].push_back({i, i + L});
                        }
                    }
                }
            }

            return results;
        }

            string text, vector<string> keywords)

            for (auto &k : keywords) {
                transform(k.begin(), k.end(), k.begin(), ::tolower);
            }
            return rabinKarpMulti(text, keywords);
        }
