     const pages = [
  {
    id: 'p1',
    zone: 'Salt Farms',
    title: 'Weather Impact Prediction for Salt Farming',
    photo: './saish/Rabin-Karp.jpg',
    phototitle: 'Rabin Karp Algorithm',
    problem: `Salt farmers in coastal regions face sudden weather changes like cyclones and heavy rain that can damage large portions of their salt pans. Although general weather forecasts exist, farmers do not get precise, farm-level information about which pans are at risk and how much total area may be affected if no preventive action is taken. This uncertainty leads to poor decisions, unnecessary work, or large losses when storms hit unexpectedly. There is a need for a system that can detect dangerous weather patterns early and estimate the affected pan area clearly and quickly.

`,
    solution: `Use sensor streams + simple forecast feeds. Detect dangerous weather signatures by running Rabin–Karp on recent pressure/wind time-series to spot cyclone-like patterns quickly. When a pattern is detected, index pans in a spatial tree (quadtree or grid) to get candidate pans inside the storm footprint, then build a pan adjacency graph and run BFS from directly-hit pans to propagate risk to connected pans. Finally Merge Sort the affected pans by area/severity for reporting.
Why these fit: Rabin–Karp is fast for matching short patterns in streaming data; spatial trees reduce the number of point-in-region checks; BFS models physical overflow/adjacency; Merge Sort gives stable O(n log n) ordering for farmer-facing priority lists.

`,
    algos: ['Rabin_Karp Alogoritms', 'Tree-based Spatial Index(QuadTree)','Graph Algorithms (BFS)','Lookup table','Arrays'
],
    sdgs: [
      
      'SDG 13– Climate Action',
      'SDG 9 – Industry, Innovation and Infrastructure',
      'SDG 12 – Sustainable Cities and Communities'
    ],
    codeSnippet: `#include <bits/stdc++.h>
using namespace std;

/* ------------ Data Structures ------------ */

struct Pan {
    int id;
    double x, y;   // coordinates (simple 2D)
    double area;   // in m^2
    bool affected; // whether this pan is affected by storm
};

/* ------------ Rabin–Karp: detect dangerous pattern in sensor data ------------ */
// Here we treat sensor data as an integer sequence (e.g., pressure readings).

bool rabinKarpMatch(const vector<int>& text, const vector<int>& pattern) {
    if (pattern.empty() || text.size() < pattern.size()) return false;

    const long long base = 257;
    const long long mod  = 1000000007LL;

    int n = text.size();
    int m = pattern.size();

    long long patHash = 0, txtHash = 0, power = 1;

    // base^(m-1)
    for (int i = 0; i < m - 1; ++i) {
        power = (power * base) % mod;
    }

    // initial hash
    for (int i = 0; i < m; ++i) {
        patHash = (patHash * base + pattern[i]) % mod;
        txtHash = (txtHash * base + text[i]) % mod;
    }

    for (int i = 0; i <= n - m; ++i) {
        if (patHash == txtHash) {
            bool same = true;
            for (int j = 0; j < m; ++j) {
                if (text[i + j] != pattern[j]) {
                    same = false;
                    break;
                }
            }
            if (same) return true;
        }
        // roll hash
        if (i < n - m) {
            long long remove = (text[i] * power) % mod;
            txtHash = (txtHash - remove + mod) % mod;
            txtHash = (txtHash * base + text[i + m]) % mod;
        }
    }
    return false;
}

/* ------------ Build adjacency (graph) of neighboring pans ------------ */

vector<vector<int>> buildAdjacency(const vector<Pan>& pans, double neighborDist) {
    int n = (int)pans.size();
    vector<vector<int>> adj(n);
    double nd2 = neighborDist * neighborDist;

    for (int i = 0; i < n; ++i) {
        for (int j = i + 1; j < n; ++j) {
            double dx = pans[i].x - pans[j].x;
            double dy = pans[i].y - pans[j].y;
            double d2 = dx * dx + dy * dy;
            if (d2 <= nd2) {
                adj[i].push_back(j);
                adj[j].push_back(i);
            }
        }
    }
    return adj;
}

/* ------------ BFS: propagate risk from directly-hit pans ------------ */

vector<int> bfsAffected(const vector<vector<int>>& adj,
                        const vector<int>& initial,
                        int n) {
    vector<bool> visited(n, false);
    queue<int> q;
    for (int idx : initial) {
        if (!visited[idx]) {
            visited[idx] = true;
            q.push(idx);
        }
    }
    vector<int> affected;
    while (!q.empty()) {
        int u = q.front(); q.pop();
        affected.push_back(u);
        for (int v : adj[u]) {
            if (!visited[v]) {
                visited[v] = true;
                q.push(v);
            }
        }
    }
    return affected;
}

/* ------------ Merge Sort: sort pans by area (descending) ------------ */

bool panLess(const Pan& a, const Pan& b) {
    // we want descending order, so "less" means larger area
    return a.area > b.area;
}

void mergePans(vector<Pan>& arr, int left, int mid, int right) {
    int n1 = mid - left + 1;
    int n2 = right - mid;
    vector<Pan> L(n1), R(n2);

    for (int i = 0; i < n1; ++i) L[i] = arr[left + i];
    for (int j = 0; j < n2; ++j) R[j] = arr[mid + 1 + j];

    int i = 0, j = 0, k = left;
    while (i < n1 && j < n2) {
        if (panLess(L[i], R[j])) arr[k++] = L[i++];
        else                      arr[k++] = R[j++];
    }
    while (i < n1) arr[k++] = L[i++];
    while (j < n2) arr[k++] = R[j++];
}

void mergeSortPans(vector<Pan>& arr, int left, int right) {
    if (left >= right) return;
    int mid = left + (right - left) / 2;
    mergeSortPans(arr, left, mid);
    mergeSortPans(arr, mid + 1, right);
    mergePans(arr, left, mid, right);
}

/* ----------------------------- MAIN ----------------------------- */

int main() {
    // 1) Simulated sensor data & danger pattern
    vector<int> sensorData   = {1010, 1008, 1005, 1001, 995, 990, 988};
    vector<int> dangerPattern = {1008, 1005, 1001, 995}; // rapid pressure drop

    bool stormDetected = rabinKarpMatch(sensorData, dangerPattern);

    if (!stormDetected) {
        cout << "No dangerous weather pattern detected. No impact prediction.\n";
        return 0;
    }

    cout << "Dangerous weather pattern detected! Predicting impact on salt pans...\n\n";

    // 2) Example pans (id, x, y, area)
    vector<Pan> pans = {
        {0, 10, 10, 1000, false},
        {1, 12, 11, 1500, false},
        {2, 20, 20, 1300, false},
        {3, 25, 19, 2000, false},
        {4, 30, 35, 1800, false},
        {5, 40, 40, 2200, false}
    };

    int n = (int)pans.size();

    // 3) Storm center + radius
    double cx = 15.0, cy = 15.0, radius = 12.0;
    double r2 = radius * radius;

    // Find directly affected pans (inside circle)
    vector<int> initialAffectedIdx;
    for (int i = 0; i < n; ++i) {
        double dx = pans[i].x - cx;
        double dy = pans[i].y - cy;
        double d2 = dx * dx + dy * dy;
        if (d2 <= r2) {
            pans[i].affected = true;
            initialAffectedIdx.push_back(i);
        }
    }

    cout << "Directly affected pans (inside storm radius):\n";
    if (initialAffectedIdx.empty()) {
        cout << "  None directly inside storm region.\n\n";
    } else {
        for (int idx : initialAffectedIdx) {
            cout << "  Pan " << pans[idx].id
                 << " at (" << pans[idx].x << "," << pans[idx].y
                 << "), area = " << pans[idx].area << " m^2\n";
        }
        cout << "\n";
    }

    // 4) Build adjacency of pans (neighbors within distance) and BFS
    double neighborDist = 8.0;
    vector<vector<int>> adj = buildAdjacency(pans, neighborDist);

    vector<int> allAffectedIdx;
    if (!initialAffectedIdx.empty()) {
        allAffectedIdx = bfsAffected(adj, initialAffectedIdx, n);
        for (int idx : allAffectedIdx) pans[idx].affected = true;
    }

    // 5) Collect affected pans and sort by area (descending) using Merge Sort
    vector<Pan> affectedPans;
    for (const auto& p : pans) {
        if (p.affected) affectedPans.push_back(p);
    }

    if (!affectedPans.empty()) {
        mergeSortPans(affectedPans, 0, (int)affectedPans.size() - 1);
    }

    double totalArea = 0.0;
    for (const auto& p : affectedPans) totalArea += p.area;

    cout << "All affected pans (after BFS propagation), sorted by area:\n";
    for (const auto& p : affectedPans) {
        cout << "  Pan " << p.id
             << " | area = " << p.area
             << " m^2 at (" << p.x << "," << p.y << ")\n";
    }
    cout << "\nTotal affected area (if no action taken): "
         << totalArea << " m^2\n";

    return 0;
}`

Why these fit: Dijkstra computes realistic road-time distances on weighted graphs (essential for true arrival ETA). Sorting gives a clear movement priority; heap/queue supports scheduling limited vehicles.

    codeSnippet: `#include <bits/stdc++.h>
using namespace std;

/* ---------------- Data Structures ---------------- */

struct Edge {
    int to;
    double cost; // travel time or cost
};

struct HeapSalt {
    int id;
    int node;            // graph node where heap is located
    int productionTime;  // minutes from start of day
    int safeDuration;    // minutes safe before moisture damage
};

struct HeapWithUrgency {
    HeapSalt heap;
    int timeLeft;        // remaining safe time (can be negative if overdue)
    double bestTravel;   // best travel cost/time to nearest godown
    int bestGodown;      // node index of nearest godown
};

/* ---------------- Dijkstra: shortest path in weighted graph ---------------- */

vector<double> dijkstra(const vector<vector<Edge>>& graph, int src) {
    int n = (int)graph.size();
    const double INF = numeric_limits<double>::infinity();
    vector<double> dist(n, INF);

    using State = pair<double,int>; // (dist, node)
    priority_queue<State, vector<State>, greater<State>> pq;

    dist[src] = 0.0;
    pq.push({0.0, src});

    while (!pq.empty()) {
        auto [d, u] = pq.top();
        pq.pop();
        if (d > dist[u]) continue;
        for (const auto& e : graph[u]) {
            int v = e.to;
            double nd = d + e.cost;
            if (nd < dist[v]) {
                dist[v] = nd;
                pq.push({nd, v});
            }
        }
    }
    return dist;
}

/* ---------------- Merge Sort: sort heaps by urgency then travel ---------------- */

bool heapLess(const HeapWithUrgency& a, const HeapWithUrgency& b) {
    // First: less timeLeft -> more urgent
    if (a.timeLeft < b.timeLeft) return true;
    if (a.timeLeft > b.timeLeft) return false;
    // If same urgency, choose smaller travel cost
    return a.bestTravel < b.bestTravel;
}

void mergeHeaps(vector<HeapWithUrgency>& arr, int left, int mid, int right) {
    int n1 = mid - left + 1;
    int n2 = right - mid;
    vector<HeapWithUrgency> L(n1), R(n2);

    for (int i = 0; i < n1; ++i) L[i] = arr[left + i];
    for (int j = 0; j < n2; ++j) R[j] = arr[mid + 1 + j];

    int i = 0, j = 0, k = left;
    while (i < n1 && j < n2) {
        if (heapLess(L[i], R[j])) arr[k++] = L[i++];
        else                       arr[k++] = R[j++];
    }
    while (i < n1) arr[k++] = L[i++];
    while (j < n2) arr[k++] = R[j++];
}

void mergeSortHeaps(vector<HeapWithUrgency>& arr, int left, int right) {
    if (left >= right) return;
    int mid = left + (right - left) / 2;
    mergeSortHeaps(arr, left, mid);
    mergeSortHeaps(arr, mid + 1, right);
    mergeHeaps(arr, left, mid, right);
}

using namespace std;

struct Edge {

/* --------- Multi-source Dijkstra: from all current bin nodes --------- */

void multiSourceDijkstra(
    const vector<vector<Edge>>& graph,
    const vector<int>& bins,          // current bin locations
    vector<double>& dist,             // output: distance to nearest bin
    vector<int>& nearestBin           // output: which bin is nearest
) {
    int n = (int)graph.size();
    const double INF = 1e18;
    dist.assign(n, INF);
    nearestBin.assign(n, -1);

    using State = pair<double,int>; // (distance, node)
    priority_queue<State, vector<State>, greater<State>> pq;

    // Initialize all current bins as sources
    for (int b : bins) {
        dist[b] = 0.0;
        nearestBin[b] = b;
        pq.push({0.0, b});
    }

    while (!pq.empty()) {
        auto [d, u] = pq.top();
        pq.pop();
        if (d > dist[u]) continue;

        for (const auto& e : graph[u]) {
            int v = e.to;
            double nd = d + e.cost;
            if (nd < dist[v]) {
                dist[v] = nd;
                nearestBin[v] = nearestBin[u]; // inherit source bin
                pq.push({nd, v});
            }
        }
    }
}

void mergeEdges(vector<Edge>& a, int L, int M, int R) {
    int n1 = M - L + 1;
    int n2 = R - M;
    vector<Edge> left(n1), right(n2);
    for (int i = 0; i < n1; ++i) left[i] = a[L + i];

        else a[k++] = right[j++];

    while (i < n1) a[k++] = left[i++];
    while (j < n2) a[k++] = right[j++];
}

    int M = L + (R - L) / 2;
    mergeSortEdges(a, L, M);
    mergeSortEdges(a, M+1, R);
    mergeEdges(a, L, M, R);
}

/* -------------------- Union-Find (DSU) -------------------- */

struct DSU {
    int n;
    vector<int> parent, rankv;
    DSU(int n=0): n(n), parent(n), rankv(n,0) {
        for (int i=0;i<n;++i) parent[i]=i;
    }
    int find(int x) {
        if (parent[x]==x) return x;
        return parent[x]=find(parent[x]);
    }
    bool unite(int a,int b) {
        a=find(a); b=find(b);
        if (a==b) return false;
        if (rankv[a]<rankv[b]) swap(a,b);
        parent[b]=a;
        if (rankv[a]==rankv[b]) rankv[a]++;
        return true;
    }

using namespace std;

struct Edge { int to; double w; };
struct AssignResult { int slotNode; double dist; };

// Dijkstra from source, returns distances vector
vector<double> dijkstra(const vector<vector<Edge>>& g, int src) {
    int n = g.size();
    const double INF = numeric_limits<double>::infinity();
    vector<double> dist(n, INF);
    using P = pair<double,int>;
    priority_queue<P, vector<P>, greater<P>> pq;
    dist[src] = 0.0; pq.push({0.0, src});
    while (!pq.empty()) {
        auto [d,u] = pq.top(); pq.pop();
        if (d > dist[u]) continue;
        for (auto &e : g[u]) {
            int v = e.to; double nd = d + e.w;
            if (nd < dist[v]) { dist[v] = nd; pq.push({nd, v}); }
        }
    }
    return dist;
}

// Find nearest free slot node given entry node.
// slots = list of slot nodes; occupancy maps node -> bool (true if occupied)
AssignResult assignNearestSlot(const vector<vector<Edge>>& graph,
                               int entryNode,
                               const vector<int>& slots,
                               const unordered_map<int,bool>& occupied)
{
    AssignResult res = {-1, 1e18};
    vector<double> dist = dijkstra(graph, entryNode);

    // Option A (simple): scan all slots and pick nearest free
    for (int slotNode : slots) {
        auto it = occupied.find(slotNode);
        bool isOcc = (it != occupied.end() ? it->second : false);
        if (!isOcc && dist[slotNode] < res.dist) {
            res.slotNode = slotNode;
            res.dist = dist[slotNode];
        }
    }
    return res;
}
