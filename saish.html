<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>City Problems — Sample 10 Pages</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #041025;
      --panel: #071428;
      --muted: #98a6b8;
      --accent: #7c3aed;
      --accent2: #06b6d4;
      --card-border: rgba(255, 255, 255, 0.04);
    }

    * {
      box-sizing: border-box;
      font-family: Inter, system-ui, Segoe UI, Roboto, Arial
    }

    html,
    body {
      height: 100%;
      margin: 0;
      background: linear-gradient(180deg, #021021 0%, #041025 100%);
      color: #eaf2ff
    }

    .app {
      max-width: 1200px;
      margin: 28px auto;
      display: grid;
      grid-template-columns: 320px 1fr;
      gap: 20px;
      padding: 18px
    }

    .sidebar {
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.01), rgba(255, 255, 255, 0.01));
      border-radius: 12px;
      padding: 18px;
      border: 1px solid var(--card-border);
    }

    .home {
      min-width: 70px;
      min-height: 40px;
      position: absolute;
      top: 10px;

      /* keep it aligned to the sidebar on large screens,
     but never go left of the sidebar padding on small screens */
      left: max(18px, calc((100vw - 1200px) / 2 + 18px));
      font-size: 18px;
      padding: 6px 3px 3px 7px;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      border-radius: 10px;
      margin: 0px 0px 0px 10px;
      border: 3px #061c42 solid;
      color: black;
      font-weight: 700;
      z-index: 1200;
      /* make sure it sits above other content */
      display: block;
      box-shadow: 0 6px 18px rgba(2, 8, 20, 0.6);
    }




    .brand {
      display: flex;
      gap: 12px;
      align-items: center;
      margin-bottom: 12px
    }

    .logo {
      width: 44px;
      height: 44px;
      border-radius: 10px;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      color: #021
    }

    .muted {
      color: var(--muted);
      font-size: 13px
    }

    .list {
      margin-top: 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      max-height: 72vh;
      overflow: auto;
      padding-right: 6px
    }

    .navitem {
      padding: 10px;
      border-radius: 10px;
      background: rgba(255, 255, 255, 0.015);
      cursor: pointer;
      border: 1px solid rgba(255, 255, 255, 0.02)
    }

    .navitem.active {
      background: linear-gradient(90deg, rgba(124, 58, 237, 0.18), rgba(6, 182, 212, 0.12));
      border-color: rgba(255, 255, 255, 0.06);

    }

    .navitem h4 {
      margin: 0 0 6px 0;
      font-size: 14px
    }

    .navitem p {
      margin: 0;
      color: var(--muted);
      font-size: 12px
    }

    .detail {
      padding: 24px;
      border-radius: 12px;
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.01), rgba(255, 255, 255, 0.01));
      border: 1px solid var(--card-border);
      min-height: 72vh;
      overflow: auto
    }

    .top {
      display: flex;
      align-items: flex-start;
      gap: 16px
    }

    .title h1 {
      margin: 0;
      font-size: 22px
    }

    .badge {
      padding: 6px 10px;
      border-radius: 10px;
      background: rgba(255, 255, 255, 0.02);
      color: var(--muted);
      font-weight: 700;
      border: 1px solid rgba(255, 255, 255, 0.03)
    }

    .hero {
      width: 100%;
      height: 260px;
      margin-top: 14px;
      border-radius: 10px;
      overflow: hidden;
      background: linear-gradient(90deg, #081827, #0b1f2f);
      display: flex;
      align-items: center;
      justify-content: center;
      background:transparent;
    }

    .hero .images{
      width: 100%;
      height: 100%;
      object-fit:contain;

      }
    .hero img {
      width: 100%;
      height: 100%;
      object-fit: cover
    }

    .block {
      margin-top: 14px;
      padding: 14px;
      border-radius: 10px;
      background: rgba(255, 255, 255, 0.02);
      border: 1px solid rgba(255, 255, 255, 0.03)
    }

    .algos {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-top: 8px
    }

    .algo {
      padding: 8px 10px;
      border-radius: 8px;
      background: linear-gradient(90deg, rgba(255, 255, 255, 0.02), rgba(255, 255, 255, 0.01));
      border: 1px solid rgba(255, 255, 255, 0.03);
      color: var(--muted);
      font-weight: 700
    }

    .actions {
      display: flex;
      gap: 8px;
      margin-left: auto
    }

    .btn {
      background: linear-gradient(90deg, var(--accent), var(--accent2));
      padding: 8px 12px;
      border-radius: 10px;
      border: none;
      color: #021;
      font-weight: 700;
      cursor: pointer;
      transition: border-radius 0.4s ease, transform 0.4s ease;
    }
    .btn:hover {
      transform: translateY(-4px) scale(1.01);
    box-shadow: 0 1px 4px rgba(148, 163, 184, 0.5);
    border-color: rgba(59, 130, 246, 0.4);
    }
    .ghost {
      background: transparent;
      border: 1px solid rgba(255, 255, 255, 0.04);
      padding: 8px 10px;
      border-radius: 8px;
      color: var(--muted);
      cursor: pointer
    }

    pre.code {
      background: #071827;
      padding: 12px;
      border-radius: 8px;
      overflow: auto;
      color: #cfeffd;
      margin: 0
    }

    @media (max-width:800px) {
      .app {
        grid-template-columns: 1fr;
        padding: 12px;
      }

      .hero {
        height: 400px;
      }
      

      @media (max-width: 800px) {
        .home {
          left: 18px;
          /* same padding as .app */
          top: 12px;
          /* tuck it a little higher on small screens */
          padding: 8px 6px;
          min-width: 62px;
        }
      }

    }
  </style>
</head>

<body>
  <a href='https://shivuas.github.io/Surajvali_city.github.io/' style="text-decoration:none;">
    <div class='home btn'>Home</div>
  </a>
  <div class="app">
    <aside class="sidebar">
      <div class="brand">
        <div class="logo">CP</div>
        <div>
          <div style="font-weight:700">City — Problems </div>
          <div class="muted">Problems related to Salt farming and residential area</div>
        </div>
      </div>

      <div class="muted" style="margin-bottom:8px">Click any problem to open its detail page.</div>

      <div class="list" id="nav">
        <!-- nav items inserted by JS -->
      </div>
    </aside>

    <main class="detail" id="detail">
      <!-- detail content injected here -->
    </main>
  </div>

  <script>
    /*
      Single-file static pages: replace content inside `pages` array if you want to edit later.
      Each page has: id, zone, title, photo (data URL or external URL), problem, solution, algos (array), codeSnippet (optional)
    */
    const pages = [
      {
        id: 'p1',
        zone: 'Salt Field',
        title: 'Weather Impact Prediction for Salt Farming',
        photo: './saish/Rabin-Karp.jpg',
        phototitle:'Rabin-Karp',
        problem: `Salt farmers in coastal regions face sudden weather changes like cyclones and heavy rain that can damage large portions of their salt pans. Although general weather forecasts exist, farmers do not get precise, farm-level information about which pans are at risk and how much total area may be affected if no preventive action is taken. This uncertainty leads to poor decisions, unnecessary work, or large losses when storms hit unexpectedly. There is a need for a system that can detect dangerous weather patterns early and estimate the affected pan area clearly and quickly.`,
        solution: `The system continuously reads sensor data (like pressure or wind speed) and uses a pattern-matching algorithm to detect dangerous weather signatures. When a risk is detected, it checks which salt pans lie within a given storm radius and then uses a graph model of neighboring pans to propagate risk to connected pans that may also be impacted. Finally, it ranks all affected pans based on area so that farmers know which pans are most critical and computes the total affected area. The output is a simple report: which pans are affected and how much area will be damaged if no action is taken.`,
        algos: ['Rabin-Karp Algorithm', 'Tree-based Spatial Index(QuadTree)','Graph Algorithms (BFS)','Lookup table','Arrays'],
        codeSnippet: `// After removing blocked edge, test connectivity via BFS\nfunction bfs(graph, source){ /* ... */ }\n// Run Dijkstra for best pressure-loss path`
      },
      {
        id: 'p2',
        zone: 'Salt Godown',
        title: 'Moisture-Safe Storage Planning.' ,
        photo: './shivaraj/Dijkstra.jpg',
        phototitle:'Dijkstra Algorithm',
        problem: `After harvesting, salt heaps are left in the open and gradually absorb moisture from the air, which reduces their quality and value. Farmers have multiple heaps produced at different times and a limited number of salt godowns at different distances. Without a systematic way to check how long each heap can safely remain exposed and which godown can be reached fastest or at the lowest travel cost, farmers often move heaps too late or to inefficient locations. This leads to avoidable quality loss and higher operational costs.`,

        solution: `The system records, for each salt heap, when it was produced and how long it can remain safely in the open before moisture damage begins. It computes the remaining safe time for every heap and ranks them by urgency. The farm and road layout, including heaps and godowns, is represented as a weighted graph, where edge weights denote realistic travel time or cost. Using Dijkstra’s algorithm, the system finds the shortest travel time from the farmer’s location (or heap location) to each salt godown. Finally, it sorts heaps and suggests for each heap the best godown to move to, prioritizing heaps with less safe time and godowns reachable with minimal travel time or cost.`,
        algos: ["Dijkstra's algorithm",'Heap','Merge Sort'],
        codeSnippet: `// Simulate arrival as BFS layers; find nodes with high visit counts -> bottlenecks`
      },
      {
        id: 'p3',
        zone: 'Residency area',
        title: 'Home Service Finder',
        photo: '',
        phototitle:'',
        problem: `Residents in a city often face sudden household issues like plumbing leaks or electrical faults and need technicians quickly. However, they struggle to know who is available, what each technician charges, and how long it will actually take them to reach the house using real roads, not just straight-line distance. Without a system that considers both realistic travel time and service price, residents may overpay, wait too long, or fail to choose the best technician for their needs.`,
        solution: `The system takes the user’s location and problem type (plumber, electrician, etc.), finds all workers who can handle that service, and models the city as a weighted graph where nodes are areas/junctions and edges are roads with travel time or cost. It uses Dijkstra’s algorithm to compute the shortest travel time from the user’s node to each worker’s node. Then it applies a custom Merge Sort to order workers primarily by their service price and secondarily by their travel time so that cheaper and faster options appear first. The app presents this ranked list to the user, who can then choose a worker (even a farther but cheaper one) and later confirm after seeing the worker’s stated travel cost.`,
        algos: ['Array list','Graph','Dijkstra','Heap(priority queue)','Merge sort'],
        codeSnippet: `// Model floors as tree; compute path 'cost' to each floor; identify long paths.`
      },
      {
        id: 'p4',
        zone: 'Residential area',
        title: 'Waste Management',
        photo: './shivaraj/Graph.webp',
        phototitle:'Greedy Algorithm',
        problem: `In many residential areas, there is only one or very few garbage collection points, which are far for some localities. People living far away often dump waste on streets or open spaces instead of walking a long distance to the bin. This creates hygiene issues and pollution. The aim is to place 4–5 dustbins at different locations in such a way that each locality has at least one nearby dustbin, instead of only one central bin, and later these bins can also be collected efficiently by the garbage truck.`,
        solution: `We model the residential area as a graph, where junctions or localities are nodes and roads between them are edges with distance or time as weights. We decide to place K = 4 or 5 dustbins. First, we select one initial dustbin location (for example, a central or important locality). Then we repeatedly do the following: we run multi-source shortest path from all currently chosen dustbin nodes to find, for every locality, the distance to its nearest dustbin. We then find the locality that is farthest from any existing dustbin and place the next dustbin there. We repeat this until we have 4–5 dustbins. This greedy method spreads the dustbins across the area so that no locality is too far from a bin, and each locality naturally gets a nearest dustbin that serves it.`,
        algos: ['Arrays','Graph as Adjancency List','Dijkstra','Greedy Algorithm'],
        codeSnippet: `// Compare shortest 'official' vs 'actual' path lengths; if ratio > threshold add new edge.`
      },
      {
        id: 'p5',
        zone: 'Residential Area',
        title: 'Gas Pipeline Layout Optimization',
        photo: './shivaraj/Kruskal.png',
        phototitle:'Kruskal Algorithm',
        problem: `In many residential areas, gas pipelines are not planned in an efficient manner. Because of this, the total pipe length becomes very high, which increases the construction cost and also creates more chances of leakage. Homes that are far from the gas source face low gas pressure, and maintenance also becomes difficult as the network becomes too complicated. If the gas line is not constructed optimally, it leads to high expenses, safety issues, and poor gas supply to some houses. So, there is a need for a proper method to connect all houses using the minimum possible pipeline length while still ensuring that every home gets reliable gas supply.`,
        solution: `To solve this issue, we can model the entire residential area as a graph where each house and main gas outlet is treated as a node, and possible pipeline routes between them are edges with distances. Using this graph, we apply Kruskal’s Minimum Spanning Tree algorithm to select only those pipeline connections that give the minimum total pipe length while still connecting every home. After constructing this optimized network, we use Dijkstra’s algorithm to measure the actual distance from the gas source to each house, which helps us identify if any home is too far and may face pressure issues. This approach ensures the gas line is laid out in a cost-effective, safe, and efficient way while reducing maintenance problems in the future.`,
        algos: ['Arrays', 'Graph','Merge sort','union Find','Kruskal','Dijkstra'],
        codeSnippet: ` 
<a href="./saish/p5.cpp" target="_blank">Open p5.cpp</a>
`
      },
      {
        id: 'p6',
        zone: 'Residential Area',
        title: 'Optimized Parking Allocation in Residential Areas',
        photo: '',
        phototitle:'BFS (Graph Algorithm)',
        problem: `In many residential buildings and apartment complexes parking is chaotic. Vehicles arrive from different entry points but parking bays are limited and not tracked properly. Residents and visitors waste time searching for free slots, sometimes park in wrong places, and security can’t quickly tell which slots are free. This causes congestion inside the premises and general inconvenience. We need a system that allocates the nearest available parking slot to each incoming vehicle, keeps an updated map of occupied/free slots, and supports release (when a car leaves) — all while minimising driving time inside the complex. `,
        solution: `Model the building roads/lanes as a weighted graph (nodes = junctions / slot locations / entries, edges = short travel times). Mark specific nodes as parking slots. When a vehicle arrives at an entry node, run Dijkstra from that entry to get shortest travel times to all nodes, then pick the nearest node that currently has a free slot. Maintain a hash/map of slot occupancy to allow O(1) checks and updates when cars arrive or depart. For listing or reporting (e.g., show top-k nearest free slots), use a min-heap (priority queue) or sort when needed. This approach gives a fast, realistic nearest-slot allocation and clean tracking for releases.`,
        algos: ['Adjacency list','Hash Table','Min heap','Dijkstra Algo','Arrays'],
        codeSnippet: `// Find nearest free slot via BFS on lane graph; compute driving path by Dijkstra.`
      },
      {
        id: 'p7',
        zone: 'IT Park',
        title: 'EV chargers at northwest corner are overcrowded',
        photo: '',
        phototitle:'',
        problem: `Several chargers are clustered causing long waiting times while other chargers remain unused.`,
        solution: `Rebalance charger locations by clustering parking demand and add a reservation token system.`,
        algos: ['Graph clustering', 'Sorting'],
        codeSnippet: `// Cluster parking nodes by demand, rank candidate charger sites by distance`
      },
      {
        id: 'p8',
        zone: 'IT Park',
        title: 'Garbage trucks follow inefficient pickup routes',
        photo: '',
        phototitle:'',
        problem: `The daily cleaner route is long and doubles back multiple times, increasing fuel and time.`,
        solution: `Recompute an efficient route that connects all bins using shortest-path distances and a greedy tour heuristic.`,
        algos: ['Dijkstra', 'Sorting (greedy TSP approx)'],
        codeSnippet: `// Build pairwise shortest distances (Dijkstra), then run greedy traversal to approximate route`
      },
      {
        id: 'p9',
        zone: 'IT Park',
        title: 'One pipe burst disconnects a whole block of offices',
        photo: '',
        phototitle:'',
        problem: `A single failure in the feed line causes many offices to lose water (single point-of-failure).`,
        solution: `Detect bridge edges in the network and add redundant loops; reorganize into ring topology where possible.`,
        algos: ['Graph algorithms', 'Kruskal'],
        codeSnippet: `// Run bridge-detection (DFS) and compute MST/Kruskal to plan rewiring`
      },
      {
        id: 'p10',
        zone: 'IT Park',
        title: 'Food court stall queues form long lines and block walkway',
        photo: '',
        phototitle:'',
        problem: `A popular stall leads to queuing that blocks the main walkway and creates congestion.`,
        solution: `Redistribute stalls, increase service capacity, and introduce virtual token queuing (SMS/app).`,
        algos: ['BFS (flow)', 'Sorting'],
        codeSnippet: `// Simulate arrivals and queue growth using BFS layers; rank stalls by throughput`
      }
    ];

    // helper to create nav and details
    const nav = document.getElementById('nav');
    const detail = document.getElementById('detail');

    function makeNav() {
      nav.innerHTML = '';
      pages.forEach((p, i) => {
        const d = document.createElement('div');
        d.className = 'navitem';
        d.dataset.id = p.id;
        d.innerHTML = `<h4>${p.title}</h4><p>${p.zone} • ${p.algos.join(', ')}</p>`;
        d.onclick = () => { select(p.id); };
        nav.appendChild(d);
      });
    }

    function select(id) {
      // set active
      Array.from(nav.children).forEach(n => n.classList.toggle('active', n.dataset.id === id));
      const p = pages.find(x => x.id === id);
      if (!p) return;
      // render detail page like the screenshot style
      detail.innerHTML = `
    <div class="top">
      <div class="title">
        <h1>${escapeHtml(p.title)}</h1>
        <div style="display:flex;gap:12px;align-items:center;margin-top:10px">
          <div class="badge">${escapeHtml(p.zone)}</div>
          
        </div>
      </div>
      <div class="actions">
        <button class="btn" onclick="viewCode('${p.id}')">View code</button>
      </div>
    </div>

    
    <div class="hero">${p.photo ? `<img class="images" src="${p.photo}" alt="photo" style="object-fit:contain;"> <h1 style="color:white; background-color:transparent; font-size:15px; padding:0px 0px 0px 5px;">${p.phototitle}</h1> ` : `<svg width="100%" height="100%" viewBox="0 0 600 260" xmlns="http://www.w3.org/2000/svg"><defs><linearGradient id="g" x1="0" x2="1"><stop offset="0" stop-color="#0b2740"/>
      <stop offset="1" stop-color="#083241"/></linearGradient></defs><rect width="100%" height="100%" fill="url(#g)"/><text x="50%" y="50%" fill="#8fbfd6" font-size="20" text-anchor="middle" dominant-baseline="middle">Replace this with your photo</text></svg>`}
      </div>
      

    <div class="block"><strong>1. Problem</strong><p style="margin-top:10px">${escapeHtml(p.problem)}</p></div>

    <div class="block"><strong>2. Practical Solution</strong><p style="margin-top:10px" class="muted">${escapeHtml(p.solution)}</p></div>

    <div class="block"><strong>3. Algorithm(s) used</strong>
      <div class="algos">${p.algos.map(a => `<div class="algo">${a}</div>`).join('')}</div>
    </div>

    

    <div style="margin-top:16px;display:flex;gap:10px">
      <a class="btn" href="#${p.id}" style="text-decoration:none;" onclick="copyLink(event,'${p.id}')">Share link</a>
      </div>
  `;
      // set URL hash for share
      location.hash = id;
    }

    function escapeHtml(s) { return (s || '').toString().replaceAll('&', '&amp;').replaceAll('<', '&lt;').replaceAll('>', '&gt;'); }

    function viewCode(id) {
      const p = pages.find(x => x.id === id);
      alert('Algorithms: ' + p.algos.join(', ') + "\\n\\nOpen this file and edit the code snippet or add your implementation.");
    }

    function copyLink(e, id) {
      e.preventDefault();
      const url = location.href.split('#')[0] + '#' + id;
      navigator.clipboard?.writeText(url).then(() => alert('Link copied to clipboard'));
    }

    // export a single page as static html file for upload
    function downloadHTML(id) {
      const p = pages.find(x => x.id === id);
      if (!p) return;
      const html = buildStandaloneHTML(p);
      const blob = new Blob([html], { type: 'text/html' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = (p.title.replaceAll(/[^a-z0-9]+/ig, '_').slice(0, 60) || 'page') + '.html';
      a.click();
      URL.revokeObjectURL(a.href);
    }

    function buildStandaloneHTML(p) {
      // minimal standalone page with same styling and content
      return `<!doctype html>
<html>
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>${escapeHtml(p.title)}</title>
<style>body{font-family:Inter,system-ui,Arial;background:#041025;color:#eaf2ff;padding:28px} 
.wrap{max-width:900px;margin:0 auto} h1{font-size:24px} .hero{height:300px;background:#082734;margin-top:12px;border-radius:10px;display:flex;align-items:center;justify-content:center} 
pre{background:#071827;padding:12px;border-radius:8px;overflow:auto}</style>
</head>
<body><div class="wrap">
<h1>${escapeHtml(p.title)}</h1>
<div style="color:#98a6b8">${escapeHtml(p.zone)}</div>

<div class="hero">${p.photo ? `<img src=${p.photo} style="width:100%;height:100%;object-fit:cover;border-radius:10px">` : '<div style="color:#8fbfd6">Replace with your photo</div>'}</div>

<h2>1. Problem</h2><p>${escapeHtml(p.problem)}</p>
<h2>2. Solution</h2><p>${escapeHtml(p.solution)}</p>
<h2>3. Algorithms</h2><p>${p.algos.join(', ')}</p>
</div>
</body>
</html>`;
    }

    // quick local edit modal (simple prompt-based editing)
    function openEditModal(id) {
      const p = pages.find(x => x.id === id);
      if (!p) return;
      const t = prompt('Edit title', p.title);
      if (t === null) return;
      p.title = t;
      const prob = prompt('Edit problem (short)', p.problem);
      if (prob !== null) p.problem = prob;
      const sol = prompt('Edit solution (short)', p.solution);
      if (sol !== null) p.solution = sol;
      renderNavAndMaybeOpen(id);
    }

    function editHtml(id) { alert('To edit content permanently, open this file in a text editor and change the content inside the "pages" array.'); }

    function renderNavAndMaybeOpen(hashId) {
      makeNav();
      if (location.hash) {
        select(location.hash.slice(1));
      } else {
        select(hashId || pages[0].id);
      }
    }

    // on load: render nav and open hash or first page
    window.addEventListener('load', () => {
      makeNav();
      const h = location.hash ? location.hash.slice(1) : pages[0].id;
      select(h);
    });

    // allow copy link behavior if user clicks a link with hash
    if (location.hash) { window.addEventListener('load', () => select(location.hash.slice(1))); }

  </script>
</body>

</html>
